<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Clínica Vitae</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
        .login-box { border: 1px solid #ccc; padding: 20px; border-radius: 8px; box-shadow: 2px 2px 10px #eee; }
        input { display: block; margin: 10px 0; padding: 8px; width: 250px; }
        button { padding: 10px 20px; cursor: pointer; }
        .erro { color: red; }
    </style>
</head>
<body>
<div class="login-box">
    <h2>Clínica Vitae</h2>
    <form th:action="@{/login}" method="post">
        <input type="email" name="email" placeholder="Seu e-mail" required>
        <input type="password" name="password" placeholder="Sua senha" required>
        <button type="submit">Entrar</button>
    </form>
    <p th:if="${param.erro}" class="erro">E-mail ou senha inválidos!</p>
</div>
</body>
</html>
