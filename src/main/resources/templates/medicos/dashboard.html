<!DOCTYPE html>
<html lang="pt-pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Clinica Vitae</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #0f172a; --secondary: #334155; --accent: #3b82f6; --bg: #f8fafc; --white: #ffffff; --text-main: #1e293b; --text-muted: #64748b; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text-main); display: flex; min-height: 100vh; }

        /* SIDEBAR */
        nav.sidebar { width: 280px; background-color: var(--primary); color: var(--white); padding: 40px 20px; display: flex; flex-direction: column; position: fixed; height: 100%; }
        .logo { font-size: 24px; font-weight: 700; margin-bottom: 50px; display: flex; align-items: center; gap: 10px; }
        .menu-list { list-style: none; flex-grow: 1; }
        .menu-link { text-decoration: none; color: #94a3b8; padding: 12px 15px; border-radius: 8px; display: flex; align-items: center; gap: 12px; transition: all 0.3s; }
        .menu-link:hover, .menu-link.active { background-color: var(--secondary); color: var(--white); }

        /* CONTENT */
        main.content { margin-left: 280px; flex-grow: 1; padding: 40px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 25px; margin-bottom: 40px; }
        .stat-card { background: var(--white); padding: 30px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .value { font-size: 32px; font-weight: 700; margin-top: 10px; display: block; }
        .section-card { background: var(--white); border-radius: 16px; padding: 30px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; padding: 15px; border-bottom: 2px solid var(--bg); color: var(--text-muted); }
        td { padding: 15px; border-bottom: 1px solid var(--bg); }
        .status-badge { padding: 5px 12px; border-radius: 20px; font-size: 12px; background: #dcfce7; color: #166534; }
    </style>
</head>
<body>

<nav class="sidebar">
    <div class="logo"><i class="fa-solid fa-house-medical"></i> <span>Vitae Cloud</span></div>
    <ul class="menu-list">
        <li><a href="#" class="menu-link active"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
        <li><a href="#" class="menu-link"><i class="fa-solid fa-calendar-check"></i> Consultas</a></li>
    </ul>
    <a href="/login" style="color: #ef4444; text-decoration: none;"><i class="fa-solid fa-right-from-bracket"></i> Sair</a>
</nav>

<main class="content">
    <header>
        <div class="user-info"><h1>Dashboard Médico</h1><p>Bem-vindo ao painel de controlo.</p></div>
    </header>

    <section class="stats-grid">
        <div class="stat-card"><h3>Pacientes Hoje</h3><span class="value">12</span></div>
        <div class="stat-card"><h3>Pendentes</h3><span class="value">04</span></div>
    </section>

    <section class="section-card">
        <h2>Próximas Consultas</h2>
        <table>
            <thead><tr><th>Paciente</th><th>Hora</th><th>Status</th></tr></thead>
            <tbody>
            <tr><td>João Silva</td><td>14:30</td><td><span class="status-badge">Confirmado</span></td></tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
