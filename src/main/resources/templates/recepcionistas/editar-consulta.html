<!DOCTYPE html>
<html lang="pt-pt" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Alterar Consulta | Clinica Vitae</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root { --primary: #0f172a; --accent: #f59e0b; --bg: #f8fafc; --border: #cbd5e1; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background-color: var(--bg); padding: 40px; display: flex; justify-content: center; }
    .container { background: white; padding: 40px; border-radius: 16px; width: 100%; max-width: 650px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
    h1 { font-size: 24px; color: var(--primary); margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
    .form-group { margin-bottom: 20px; position: relative; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    label { display: block; font-size: 14px; font-weight: 600; color: #475569; margin-bottom: 8px; }
    input, select, textarea { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 15px; }
    textarea { resize: vertical; height: 100px; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
    .actions { display: flex; justify-content: flex-end; gap: 15px; margin-top: 30px; }
    .btn { padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; text-decoration: none; font-size: 15px; border: none; }
    .btn-cancel { background: #e2e8f0; color: #475569; }
    .btn-submit { background: var(--accent); color: white; }

    .autocomplete-dropdown {
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background: white;
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        max-height: 220px;
        overflow-y: auto;
        z-index: 999;
        display: none;
        margin-top: 4px;
    }
    .autocomplete-item { padding: 12px 16px; cursor: pointer; font-size: 14px; transition: background 0.2s; }
    .autocomplete-item:hover { background: #f1f5f9; color: var(--accent); }
  </style>
</head>
<body>

<div class="container">
  <h1><i class="fa-solid fa-calendar-days" style="color: var(--accent);"></i> Alterar / Remarcar Consulta</h1>

  <form th:action="@{/consultas/atualizar/{id}(id=${consulta.idConsulta})}" th:object="${consulta}" method="POST">

    <input type="hidden" th:field="*{idConsulta}">
    <input type="hidden" th:field="*{recepcionista.idRecepcionista}">

    <div class="form-group">
      <label for="pacienteSearch">Paciente</label>
      <input type="text" id="pacienteSearch"
             th:value="${consulta.paciente != null ? consulta.paciente.nome + ' (CC: ' + consulta.paciente.cartaoCidadao + ')' : ''}"
             placeholder="🔍 Digite o Nome ou CC para procurar..." autocomplete="off" required>
      <input type="hidden" th:field="*{paciente.idPaciente}" id="pacienteId">

      <div id="pacienteDropdown" class="autocomplete-dropdown">
        <div th:each="p : ${pacientes}"
             class="autocomplete-item"
             th:data-id="${p.idPaciente}"
             th:data-search="${p.nome.toLowerCase() + ' ' + p.cartaoCidadao}"
             th:data-display="${p.nome + ' (CC: ' + p.cartaoCidadao + ')'}"
             th:text="${p.nome + ' (CC: ' + p.cartaoCidadao + ')'}">
        </div>
      </div>
    </div>

    <div class="form-group">
      <label for="medico">Médico</label>
      <select id="medico" th:field="*{medico.idMedico}" required>
        <option th:each="m : ${medicos}" th:value="${m.idMedico}" th:text="${m.nome}"></option>
      </select>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="dia">Nova Data</label>
        <input type="date" id="dia" th:field="*{dia}" required>
      </div>
      <div class="form-group">
        <label for="hora">Novo Horário</label>
        <input type="time" id="hora" th:field="*{hora}" required>
      </div>
    </div>

    <div class="form-group">
      <label for="estado">Estado Atual da Consulta</label>
      <select id="estado" th:field="*{estadoConsultaEnum}" required>
        <option th:each="status : ${estados}" th:value="${status}" th:text="${status}"></option>
      </select>
    </div>

    <div class="form-group">
      <label for="categoria">Categoria</label>
      <select id="categoria" th:field="*{categoria}" required>
        <option th:each="cat : ${categorias}" th:value="${cat}" th:text="${cat.descricao}"></option>
      </select>
    </div>

    <div class="form-group">
      <label for="descricao">Descrição</label>
      <textarea id="descricao" th:field="*{descricao}" required></textarea>
    </div>

    <div class="actions">
      <a href="/recepcionistas/dashboard" class="btn btn-cancel">Voltar</a>
      <button type="submit" class="btn btn-submit">Gravar Alterações</button>
    </div>

  </form>
</div>

<script>
  const searchInput = document.getElementById('pacienteSearch');
  const dropdown = document.getElementById('pacienteDropdown');
  const hiddenInput = document.getElementById('pacienteId');
  const items = document.querySelectorAll('.autocomplete-item');

  searchInput.addEventListener('input', filtrarPacientes);
  searchInput.addEventListener('focus', () => { if(searchInput.value.length >= 0) dropdown.style.display = 'block'; });

  function filtrarPacientes() {
      const filtro = searchInput.value.toLowerCase();
      let temResultados = false;

      items.forEach(item => {
          const termoPesquisa = item.getAttribute('data-search');
          if (termoPesquisa.includes(filtro)) {
              item.style.display = 'block';
              temResultados = true;
          } else {
              item.style.display = 'none';
          }
      });
      dropdown.style.display = temResultados ? 'block' : 'none';
  }

  items.forEach(item => {
      item.addEventListener('click', function() {
          searchInput.value = this.getAttribute('data-display');
          hiddenInput.value = this.getAttribute('data-id');
          dropdown.style.display = 'none';
      });
  });

  document.addEventListener('click', function(e) {
      if (!searchInput.contains(e.target) && !dropdown.contains(e.target)) {
          dropdown.style.display = 'none';
      }
  });
</script>
</body>
</html>
